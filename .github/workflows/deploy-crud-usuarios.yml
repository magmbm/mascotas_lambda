name: Deploy CRUD Usuarios

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-crud-usuarios.yml'
      - 'CRUDUsuarios/**'
      - 'tsconfig.build.json'
      - 'package.json'
      - 'package-lock.json'

jobs:
  deploy-lambda:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      # Se compila CRUDUsuarios directamente: tsconfig.build.json está
      # configurado para CRUDMascota y no emite crud_usuario.mjs.
      - name: Compilar TypeScript
        run: |
          rm -rf dist
          npx tsc --ignoreConfig CRUDUsuarios/crud_usuario.mts \
            --outDir dist \
            --rootDir CRUDUsuarios \
            --target ES2022 \
            --lib ES2022 \
            --module nodenext \
            --moduleResolution nodenext \
            --allowImportingTsExtensions \
            --rewriteRelativeImportExtensions \
            --strict \
            --esModuleInterop \
            --skipLibCheck \
            --resolveJsonModule \
            --types node,pg

          # El handler debe quedar en la raíz del zip
          test -f dist/crud_usuario.mjs

      - name: Dejar solo dependencias de producción
        run: npm prune --omit=dev

      - name: Empaquetar la lambda
        run: |
          # 1. Crear package.json mínimo para ESM
          cat > dist/package.json <<'JSON'
          {
            "name": "crud-usuario",
            "version": "1.0.0",
            "type": "module",
            "dependencies": {
              "pg": "^8.23.0"
            }
          }
          JSON

          # 2. Comprimir desde la raíz de dist/
          cd dist
          zip -r ../function.zip . -x "*.map" "*.ts"
          cd ..
          zip -r function.zip node_modules -x "*.md" "*.map" "*.ts" "*.DS_Store"

          # 3. Mostrar el contenido del zip para verificar que crud_usuario.mjs esté en la raíz
          unzip -l function.zip | head -20

      - name: Desplegar a AWS Lambda
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
        run: |
          aws lambda update-function-code \
            --function-name crud_usuarios \
            --zip-file fileb://function.zip \
            --region "$AWS_DEFAULT_REGION"

          aws lambda wait function-updated \
            --function-name crud_usuarios \
            --region "$AWS_DEFAULT_REGION"

          aws lambda update-function-configuration \
            --function-name crud_usuarios \
            --handler crud_usuario.handler \
            --region "$AWS_DEFAULT_REGION"