name: Deploy CRUD Mascotas

on:
  push:
    branches:
      - main
    
    paths:
      - 'CRUD mascota/post_mascota.mts'
      - 'CRUD mascota/delete_mascota.mts'
      - 'CRUD mascota/crud_mascota.mts'
      - 'package.json'
      - 'package-lock.json'

jobs:
  deploy-lambda:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: |
          npm ci

      - name: Compilar y empaquetar código TypeScript
        run: |
          # Importante usar comillas por el espacio en la carpeta "CRUD mascota"
          npx esbuild "CRUD mascota/crud_mascota.mts" --bundle --platform=node --target=node20 --outfile=index.js
          zip function.zip index.js

      - name: Desplegar a AWS Lambda
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }} # Obligatorio para AWS Learner Lab
          AWS_DEFAULT_REGION: 'us-east-1' # Cambia a 'us-east-2' si tu Lambda fue creada en Ohio
        run: |
          aws lambda update-function-code \
            --function-name NOMBRE_DE_TU_LAMBDA_EN_AWS \
            --zip-file fileb://function.zip \
            --region us-east-1